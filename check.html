<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>drowninginsymbols · checks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Checks</h1>
    <p class="muted">Checks the database, the parser, the problems and the AI helper (without calling it). Run after editing data.js.</p>
    <pre id="out" class="card">running…</pre>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
  (async () => {
    const fails = [];
    const ok = (cond, msg) => { if (!cond) fails.push(msg); };
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const KINDS = ['quantity', 'constant', 'unit', 'label', 'operator'];

    // --- the database ---
    const ids = new Set();
    for (const m of DB.meanings) {
      ok(!ids.has(m.id), `duplicate meaning id ${m.id}`);
      ids.add(m.id);
      ok(DB.topics[m.topic], `${m.id}: unknown topic ${m.topic}`);
      ok(KINDS.includes(m.kind), `${m.id}: unknown kind ${m.kind}`);
      ok(Array.isArray(m.cur) && m.cur.length && m.cur.every(c => DB.cur[c]), `${m.id}: bad cur ${m.cur}`);
      ok(m.name && m.note && m.q, `${m.id}: needs name, note and q`);
      if (m.kind !== 'unit') {
        for (const spelling of [m.sym, ...(m.alias || [])]) {
          const t = tokenize(normalize(spelling).s);
          ok(t.length === 1 && t[0].v === m.sym, `${m.id}: "${spelling}" reads as [${t.map(x => x.v).join(' ')}], not ${m.sym}`);
        }
      }
    }
    const fids = new Set();
    for (const f of DB.formulas) {
      ok(!fids.has(f.id), `duplicate formula id ${f.id}`);
      fids.add(f.id);
      ok(DB.topics[f.topic] && f.law && f.name, `${f.id}: needs topic, law and name`);
      ok(same(symsOf(f.f).sort(), Object.keys(f.vars).sort()), `${f.id}: "${f.f}" has symbols [${symsOf(f.f).join(' ')}], vars has [${Object.keys(f.vars).join(' ')}]`);
      for (const [k, id] of Object.entries(f.vars)) {
        ok(ids.has(id), `${f.id}: vars.${k} points to missing meaning ${id}`);
        if (ids.has(id)) ok(byId(id).sym === k, `${f.id}: vars.${k} points to ${id}, whose symbol is ${byId(id).sym}`);
      }
    }

    // --- the parser and the context inference ---
    const neutral = { cur: 'any', level: 'school' };
    const topFor = (input, sym) => { const p = parse(input); return (rank(sym, context(p, { profile: neutral }))[0] || { m: {} }).m.id; };
    ok(normalize('rho').s === 'ρ', 'rho -> ρ');
    ok(normalize('\\nu').s === 'ν', '\\nu -> ν');
    ok(normalize('v₀').s === 'v_0', 'v₀ -> v_0');
    ok(normalize('ϕ').s === 'φ', 'ϕ -> φ');
    ok(normalize('x²').s === 'x^2', 'x² -> x^2');
    ok(same(symsOf('pV = nRT'), ['p', 'V', 'n', 'R', 'T']), 'pV = nRT splits into p V n R T');
    ok(same(symsOf('ΔU = A + Q'), ['Δ', 'U', 'A', 'Q']), 'ΔU = A + Q splits into Δ U A Q');
    ok(same(symsOf('N = N_0 e^{-λt}'), ['N', 'N_0', 'e', 'λ', 't']), 'decay law splits correctly');
    ok(render('v^2').includes('<sup>2</sup>'), 'v^2 renders a superscript');
    ok((matchFormula(symsOf('pV=nRT')) || {}).law === 'ideal-gas', 'pV=nRT is recognised as the ideal gas law');
    ok(topFor('pV = nRT', 'p') === 'p-pressure', 'p in pV = nRT is pressure');
    ok(topFor('p = mv', 'p') === 'p-momentum', 'p in p = mv is momentum');
    ok(topFor('Q = 5 C', 'Q') === 'Q-charge', 'Q = 5 C is a charge');
    ok(topFor('Q = 500 J', 'Q') === 'Q-heat', 'Q = 500 J is heat');
    ok(topFor('60 W', 'W') === 'W-watt', '60 W is the watt');
    ok(parse('Q = 5 C').syms.length === 1, '"Q = 5 C" asks about Q only');
    ok(hasWord('the moment of a force', 'moment') && !hasWord('momentum is conserved', 'moment'), 'words match whole words only');
    ok(hasWord('công của lực f', 'công của lực') && !hasWord('vật lí', 'vật l'), 'Vietnamese whole-word matching');
    ok(same(symsOf('F_x = Fcosθ'), ['F_x', 'F', 'θ']), 'Fcosθ is F cos θ, not F_c o s θ');
    ok(normalize('\\vec{F} = m\\vec{a}').s === 'F = ma' && normalize('\\frac{1}{2}mv^2').s === '(1)/(2)mv^2', 'pasted LaTeX is unwrapped');
    ok(same(symsOf('\u2211I = 0'), ['Σ', 'I']) && normalize('\u2206U').s === 'ΔU' && parse('R = 10 \u2126').unit === 'Ω', 'look-alike Σ, Δ and Ω signs are read as the Greek letters');
    ok(typeof normalize('constructor').s === 'string', 'ordinary words are not mistaken for Greek names');
    ok(render('v′_1').includes('<sub>1</sub>'), 'a subscript after a prime is still drawn as a subscript');
    const wordsOnly = context(parse('v'), { words: 'is the speed of a wave on a string', profile: neutral });
    ok(same(wordsOnly.syms, ['v']) && wordsOnly.text.includes('wave'), 'words from a photo are searched, not read as symbols');

    // --- the problems page ---
    const pids = new Set();
    for (const p of DB.problems) {
      ok(!pids.has(p.id), `duplicate problem id ${p.id}`);
      pids.add(p.id);
      ok(DB.topics[p.topic] && p.sub && p.title && p.q && p.answer && p.trap, `${p.id}: needs topic, sub, title, q, answer and trap`);
      ok(Array.isArray(p.steps) && p.steps.length > 1, `${p.id}: needs at least two steps`);
      ok(Array.isArray(p.uses) && p.uses.length && p.uses.every(id => fids.has(id)), `${p.id}: "uses" must list formula ids that exist`);
      ok([p.q, p.answer, p.trap, ...(p.steps || [])].every(t => (String(t).match(/`/g) || []).length % 2 === 0), `${p.id}: a backtick is not closed`);
    }
    for (const p of DB.problems) { try { problemHTML(p); } catch (e) { fails.push(`${p.id}: cannot be drawn (${e.message})`); } }
    ok(fmt('<b onclick=x> `v_0`') === '&lt;b onclick=x&gt; <span class="math"><span class="v">v</span><sub>0</sub></span>', 'fmt escapes markup and renders formulas');
    ok(fmt('**Step 1: `F = ma`**').startsWith('<b>Step 1: <span class="math">') && fmt('```\nF = ma\n```').startsWith('<span class="math">'), 'fmt handles bold around a formula and code blocks');

    // --- the AI helper, with the network replaced by a stub (nothing is sent) ---
    const realFetch = window.fetch, cfg = { key: 'test-key', model: 'test-model' };
    let sent;
    // a real reply starts with a thinking block, so the stub does too
    window.fetch = async (url, o) => { sent = { url, o }; return { ok: true, status: 200, json: async () => ({ content: [{ type: 'thinking', thinking: '', signature: 'x' }, { type: 'text', text: 'hello' }], stop_reason: 'end_turn' }) }; };
    ok(await ai('s', [{ role: 'user', content: 'q' }], 10, 'low', cfg) === 'hello', 'ai() returns the reply text');
    const body = JSON.parse(sent.o.body), hd = sent.o.headers;
    ok(sent.url === AI_URL && sent.o.method === 'POST' && hd['x-api-key'] === 'test-key' && hd['anthropic-version'] === '2023-06-01' && hd['anthropic-dangerous-direct-browser-access'] === 'true'
      && body.model === 'test-model' && body.max_tokens === 10 && body.output_config.effort === 'low' && body.system === 's' && same(body.messages, [{ role: 'user', content: 'q' }]),
      'ai() sends the browser headers, the key, the model, the limit, the effort, the system prompt and the messages');
    window.fetch = async () => ({ ok: false, status: 401, json: async () => ({ error: { message: 'invalid x-api-key' } }) });
    ok(await ai('s', [], 10, 'low', cfg).catch(e => e.message) === 'The API key was not accepted. Check it in AI settings.', 'ai() explains a rejected key');
    window.fetch = async () => { throw new TypeError('offline'); };
    ok(String(await ai('s', [], 10, 'low', cfg).catch(e => e.message)).startsWith('Could not reach'), 'ai() explains a network failure');
    window.fetch = async () => ({ ok: true, status: 200, json: async () => ({ content: [{ type: 'thinking', thinking: '', signature: 'x' }], stop_reason: 'max_tokens' }) });
    ok(String(await ai('s', [], 10, 'low', cfg).catch(e => e.message)).startsWith('The AI ran out of room'), 'ai() explains a reply that was all thinking');
    window.fetch = realFetch;
    ok(tutorSystem()[0].text.includes('pV = nRT') && tutorSystem()[0].cache_control, 'the AI is given the database');

    const out = document.getElementById('out');
    out.textContent = fails.length
      ? `${fails.length} PROBLEM(S)\n\n` + fails.join('\n')
      : `ALL CHECKS PASSED\n${DB.meanings.length} meanings, ${DB.formulas.length} formulas, ${DB.glyphs.length} glyphs, ${DB.problems.length} problems`;
    document.title = (fails.length ? 'FAIL' : 'PASS') + ' · checks';
  })().catch(e => { document.getElementById('out').textContent = 'THE CHECKS CRASHED\n\n' + e.stack; document.title = 'FAIL · checks'; });
  </script>
</body>
</html>
